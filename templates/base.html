{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Expired Bread{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'documents/css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'documents:index' %}" class="logo">Expired Bread</a>
            <form method="get" action="{% url 'documents:search' %}" class="header-search">
                <input type="search" name="q" placeholder="Поиск документов…"
                       value="{{ request.GET.q|default:'' }}">
                <button type="submit">Найти</button>
            </form>
            <nav>
                <a href="{% url 'documents:list' %}">Документы</a>
                <a href="{% url 'documents:upload' %}">Загрузить</a>
                <a href="{% url 'documents:ask' %}">Спросить</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <small>Expired Bread — прототип v1.0</small>
        </div>
    </footer>

    <script src="{% static 'documents/js/app.js' %}"></script>
</body>
</html>
